# デフォルト・プロファイル
# --profile を指定せずに起動したときに使われます。
# 自分専用のエージェントを作るには: python main.py --init <名前>

name = "default"

# モデルの明示指定(任意)。省略時は既定モデルを使う。
# model = "gemini-3.5-flash"

# エージェント固有の性格・方針(システムプロンプトに追記)。既定は指定なし。
persona = ""

# プラグイン(自作ツール)を読み込むディレクトリ一覧。
plugins = ["plugins"]

# 認可された対象スコープ(IP / CIDR / ホスト名)。空なら範囲チェックは無効。
# 配布時は必ず設定すること。範囲外への操作を実行前にブロックし、事故を防ぐ。
# 起動時に指定した対象(target)は自動で許可される。
# scope = ["10.20.0.0/24", "192.168.56.0/24", "target.example.local"]
scope = []
