# Sikun Cyber Security — プロジェクト定義(Node.js の package.json 相当)。
# 依存・コマンドを1ファイルに集約。用途別の extras:
#   pip install -e .             # コア(TUI + Claude エンジン)
#   pip install -e ".[browser]"  # + headless ブラウザツール(playwright)
#   pip install -e ".[all,dev]"  # 全部 + テスト。SikunCybersecurity コマンドも入る
# requirements.txt / requirements-dev.txt は素の pip 用のコア一式。pyproject が正(canonical)。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sikun-cyber-security"
version = "3.0.0"
description = "認可された対象に対する攻撃的セキュリティ診断を自律的に行うAIエージェント(TUI + Claude Agent SDK)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60.0",
    "rich>=13.7.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "claude-agent-sdk>=0.2.0",
]

[project.optional-dependencies]
# browser_fetch(DOM/JS依存のWeb課題向け)。別途 `playwright install chromium` が必要。
browser = ["playwright>=1.40.0"]
# Metasploit RPC 連携プラグイン(本体 metasploit-framework は別途OS側で導入)。
msf = ["pymetasploit3>=1.0.0"]
dev = ["pytest>=8.0.0"]
all = [
    "playwright>=1.40.0",
    "pymetasploit3>=1.0.0",
]

[project.scripts]
# `SikunCybersecurity <対象>` で起動(claude のように)。短縮別名も用意。
SikunCybersecurity = "main:main"
sikun = "main:main"
scs = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["sikun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
